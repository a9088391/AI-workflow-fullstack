services:
  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: articles_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?run ops/setup.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles_owner -d articles"]
      interval: 2s
      timeout: 3s
      retries: 20

  sql:
    build:
      context: .
      dockerfile: backends/laravel/Dockerfile
    command: ["php", "/srv/ops/sql/apply.php"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: articles
      DB_OWNER_USER: articles_owner
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?run ops/setup.sh first}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?run ops/setup.sh first}
      PROJECT_WRITERS_STOPPED: ${PROJECT_WRITERS_STOPPED:-0}
      BACKUP_DIR: /backups
    volumes:
      - ./ops/sql:/srv/ops/sql:ro
      - ./database/sql:/srv/database/sql:ro
      - ./.local/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  laravel:
    build:
      context: .
      dockerfile: backends/laravel/Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?run ops/setup.sh first}
      APP_URL: http://localhost:8081
      APP_LOCALE: zh_TW
      PHP_CLI_SERVER_WORKERS: "4"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: articles
      DB_USERNAME: articles_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?run ops/setup.sh first}
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    volumes:
      - ./.local/laravel-logs:/srv/laravel/storage/logs
      - ./.local/keys/laravel.key:/run/secrets/laravel-jwt.key:ro
    ports:
      - "127.0.0.1:8081:8000"
    depends_on:
      sql:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 2s
      timeout: 3s
      retries: 20

  symfony:
    build:
      context: .
      dockerfile: backends/symfony/Dockerfile
    environment:
      APP_ENV: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: articles
      DB_USERNAME: articles_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?run ops/setup.sh first}
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - ./.local/symfony-logs:/srv/symfony/var/log
      - ./.local/keys/symfony.key:/run/secrets/symfony-jwt.key:ro
    ports:
      - "127.0.0.1:8082:8000"
    depends_on:
      sql:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 2s
      timeout: 3s
      retries: 20

  aspnet-core:
    build:
      context: .
      dockerfile: backends/aspnet-core/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: articles
      DB_USERNAME: articles_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?run ops/setup.sh first}
    volumes:
      - ./.local/keys/aspnet-core.key:/run/secrets/aspnet-core-jwt.key:ro
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      sql:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 2s
      timeout: 3s
      retries: 20

  django:
    # 一般啟動腳本會明確指定；舊票隔離 fixture 的預設 up 不載入此服務。
    profiles: ["django"]
    build:
      context: .
      dockerfile: backends/django/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: articles
      DB_USERNAME: articles_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?run ops/setup.sh first}
    volumes:
      - ./.local/keys/django.key:/run/secrets/django-jwt.key:ro
    ports:
      - "127.0.0.1:8084:8000"
    depends_on:
      sql:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/up', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

  flask:
    # 舊票隔離 fixture 不載入此服務；一般啟動腳本會明確指定。
    profiles: ["flask"]
    build:
      context: .
      dockerfile: backends/flask/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: articles
      DB_USERNAME: articles_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?run ops/setup.sh first}
    volumes:
      - ./.local/keys/flask.key:/run/secrets/flask-jwt.key:ro
    ports:
      - "127.0.0.1:8085:8000"
    depends_on:
      sql:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/up', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

  fastapi:
    # 舊票隔離 fixture 不載入此服務；一般啟動腳本明確指定。
    profiles: ["fastapi"]
    build:
      context: .
      dockerfile: backends/fastapi/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: articles
      DB_USERNAME: articles_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?run ops/setup.sh first}
    volumes:
      - ./.local/keys/fastapi.key:/run/secrets/fastapi-jwt.key:ro
    ports:
      - "127.0.0.1:8086:8000"
    depends_on:
      sql:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/up', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

  gin:
    # 舊票隔離 fixture 不載入此服務；一般啟動腳本會明確指定。
    profiles: ["gin"]
    build:
      context: .
      dockerfile: backends/gin/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: articles
      DB_USERNAME: articles_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?run ops/setup.sh first}
    volumes:
      - ./.local/keys/gin.key:/run/secrets/gin-jwt.key:ro
    ports:
      - "127.0.0.1:8087:8000"
    depends_on:
      sql:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 2s
      timeout: 3s
      retries: 20

  frontend-vue:
    build:
      context: ./frontend/vue
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/vue/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

  frontend-nuxt:
    build:
      context: ./frontend/nuxt
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/nuxt/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.30.5-alpine3.24@sha256:bf3201ab56f23e5954646379c775d511fc466e9f11376d9725361064ad07ed35
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      frontend-vue:
        condition: service_healthy
      frontend-nuxt:
        condition: service_healthy
      laravel:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/vue/"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
