register:
    path: /api/auth/register
    controller: App\AccountController::register
    methods: [POST]
login:
    path: /api/auth/login
    controller: App\AccountController::login
    methods: [POST]
logout:
    path: /api/auth/logout
    controller: App\AccountController::logout
    methods: [POST]
me:
    path: /api/me
    controller: App\AccountController::me
    methods: [GET]
articles:
    path: /api/articles
    controller: App\ArticleController::articles
    methods: [GET]
article_create:
    path: /api/articles
    controller: App\ArticleController::createArticle
    methods: [POST]
my_articles:
    path: /api/me/articles
    controller: App\ArticleController::myArticles
    methods: [GET]
my_comments:
    path: /api/me/comments
    controller: App\CommentController::myComments
    methods: [GET]
article:
    path: /api/articles/{article_id}
    controller: App\ArticleController::article
    methods: [GET]
article_update:
    path: /api/articles/{article_id}
    controller: App\ArticleController::updateArticle
    methods: [PUT]
article_visibility:
    path: /api/articles/{article_id}/visibility
    controller: App\ArticleController::articleVisibility
    methods: [PUT]
comments:
    path: /api/articles/{article_id}/comments
    controller: App\CommentController::comments
    methods: [GET]
comment_create:
    path: /api/articles/{article_id}/comments
    controller: App\CommentController::createComment
    methods: [POST]
comment:
    path: /api/comments/{comment_id}
    controller: App\CommentController::comment
    methods: [GET]
comment_update:
    path: /api/comments/{comment_id}
    controller: App\CommentController::updateComment
    methods: [PUT]
comment_visibility:
    path: /api/comments/{comment_id}/visibility
    controller: App\CommentController::commentVisibility
    methods: [PUT]
members:
    path: /api/members
    controller: App\MemberController::members
    methods: [GET]
member:
    path: /api/members/{member_id}
    controller: App\MemberController::member
    methods: [GET]
member_status:
    path: /api/members/{member_id}/status
    controller: App\MemberController::memberStatus
    methods: [PUT]
admin_comments:
    path: /api/comments
    controller: App\CommentController::adminComments
    methods: [GET]
login_lockout_settings:
    path: /api/settings/login-lockout
    controller: App\LoginLockoutSettingsController::loginLockoutSettings
    methods: [GET]
login_lockout_settings_update:
    path: /api/settings/login-lockout
    controller: App\LoginLockoutSettingsController::updateLoginLockoutSettings
    methods: [PUT]
