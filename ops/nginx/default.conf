server {
    listen 80;
    server_name localhost;

    location = / {
        return 302 /vue/;
    }

    location /vue/ {
        proxy_pass http://frontend-vue:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(nuxt|react|next|angular|sveltekit)/ {
        default_type text/plain;
        return 503 '此版本尚未提供';
    }
}
