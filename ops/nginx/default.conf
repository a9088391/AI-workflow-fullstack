server {
    listen 80;
    server_name localhost;

    location = / {
        return 302 /vue/;
    }

    location /vue/ {
        proxy_pass http://frontend-vue:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /nuxt/ {
        proxy_pass http://frontend-nuxt:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /react/ {
        # 舊票隔離環境可能沒有 React；僅在請求此路徑時向 Docker DNS 解析。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $react_upstream frontend-react:4173;
        proxy_pass http://$react_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(next|angular|sveltekit)/ {
        default_type text/plain;
        return 503 '此版本尚未提供';
    }
}
