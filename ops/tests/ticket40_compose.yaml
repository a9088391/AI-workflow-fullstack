# Ticket 40 僅在專用資料卷、測試金鑰與 loopback 埠驗證 NestJS。
services:
  db:
    environment:
      TICKET40_FIXTURE: isolated-ticket40
    command: ["postgres", "-c", "log_min_duration_statement=0", "-c", "log_line_prefix=%m [%p] %u@%d "]
  sql:
    volumes:
      - ./.local/ticket40-backend/backups:/backups
  laravel:
    ports: !override
      - "127.0.0.1:18402:8000"
    volumes:
      - ./.local/ticket40-backend/cors.php:/srv/laravel/config/cors.php:ro
      - ./.local/ticket40-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
      - ./.local/ticket40-backend/laravel-logs:/srv/laravel/storage/logs
  nestjs:
    environment:
      CORS_ORIGIN: http://localhost:18401
    ports: !override
      - "127.0.0.1:18403:8000"
    volumes:
      - ./.local/ticket40-backend/nestjs.key:/run/secrets/nestjs-jwt.key:ro
  frontend-vue:
    build:
      context: ./.local/ticket40-frontend
  nginx:
    ports: !override
      - "127.0.0.1:18401:80"
