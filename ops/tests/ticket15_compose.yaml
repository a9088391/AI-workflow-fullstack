services:
  laravel:
    ports: !override
      - "127.0.0.1:19281:8000"
    volumes:
      - ./.local/ticket15-backend/laravel-logs:/srv/laravel/storage/logs
      - ./.local/ticket15-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
  symfony:
    ports: !override
      - "127.0.0.1:19282:8000"
    volumes:
      - ./.local/ticket15-backend/symfony-logs:/srv/symfony/var/log
      - ./.local/ticket15-backend/symfony.key:/run/secrets/symfony-jwt.key:ro
  aspnet-core:
    ports: !override
      - "127.0.0.1:19283:8080"
    volumes:
      - ./.local/ticket15-backend/aspnet-core.key:/run/secrets/aspnet-core-jwt.key:ro
  sql:
    volumes:
      - ./.local/ticket15-backend/backups:/backups
  nginx:
    ports: !override
      - "127.0.0.1:19280:80"
