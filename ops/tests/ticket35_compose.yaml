# Ticket 35 僅以專用資料卷、金鑰與 loopback 埠執行，不接觸展示資料。
services:
  db:
    environment:
      TICKET35_FIXTURE: isolated-ticket35
    command: ["postgres", "-c", "log_min_duration_statement=0", "-c", "log_line_prefix=%m [%p] %u@%d "]
  sql:
    volumes:
      - ./.local/ticket35-backend/backups:/backups
  laravel:
    ports: !override
      - "127.0.0.1:18352:8000"
    volumes:
      - ./.local/ticket35-backend/cors.php:/srv/laravel/config/cors.php:ro
      - ./.local/ticket35-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
      - ./.local/ticket35-backend/laravel-logs:/srv/laravel/storage/logs
  express:
    environment:
      CORS_ORIGIN: http://localhost:18351
    ports: !override
      - "127.0.0.1:18353:8000"
    volumes:
      - ./.local/ticket35-backend/express.key:/run/secrets/express-jwt.key:ro
  frontend-vue:
    build:
      context: ./.local/ticket35-frontend
  nginx:
    ports: !override
      - "127.0.0.1:18351:80"
