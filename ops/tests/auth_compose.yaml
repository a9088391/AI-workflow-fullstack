services:
  laravel:
    ports: !override
      - "127.0.0.1:18081:8000"
    volumes:
      - ./.local/ticket02-backend/logs:/srv/laravel/storage/logs
      - ./.local/ticket02-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
  sql:
    volumes:
      - ./.local/ticket02-backend/backups:/backups
