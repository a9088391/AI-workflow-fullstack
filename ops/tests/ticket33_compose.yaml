# Ticket 33 的容器、資料卷、金鑰與瀏覽器入口全留在專用 Compose 專案。
services:
  db:
    environment:
      TICKET33_FIXTURE: isolated-ticket33
    command: ["postgres", "-c", "log_min_duration_statement=0", "-c", "log_line_prefix=%m [%p] %u@%d "]
  sql:
    volumes:
      - ./.local/ticket33-backend/backups:/backups
  laravel:
    ports: !override
      - "127.0.0.1:18332:8000"
    volumes:
      - ./.local/ticket33-backend/cors.php:/srv/laravel/config/cors.php:ro
      - ./.local/ticket33-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
      - ./.local/ticket33-backend/laravel-logs:/srv/laravel/storage/logs
  fiber:
    environment:
      CORS_ORIGIN: http://localhost:18330
    ports: !override
      - "127.0.0.1:18331:8000"
    volumes:
      - ./.local/ticket33-backend/fiber.key:/run/secrets/fiber-jwt.key:ro
  frontend-vue:
    build:
      context: ./.local/ticket33-frontend
  nginx:
    ports: !override
      - "127.0.0.1:18330:80"
    volumes:
      - ./.local/ticket33-backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: !override
      frontend-vue:
        condition: service_healthy
      laravel:
        condition: service_healthy
