# Ticket 36 僅使用專用資料卷、金鑰與 loopback 埠驗證管理 API。
services:
  db:
    environment:
      TICKET36_FIXTURE: isolated-ticket36
    command: ["postgres", "-c", "log_min_duration_statement=0", "-c", "log_line_prefix=%m [%p] %u@%d "]
  sql:
    volumes:
      - ./.local/ticket36-backend/backups:/backups
  laravel:
    ports: !override
      - "127.0.0.1:18362:8000"
    volumes:
      - ./.local/ticket36-backend/cors.php:/srv/laravel/config/cors.php:ro
      - ./.local/ticket36-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
      - ./.local/ticket36-backend/laravel-logs:/srv/laravel/storage/logs
  express:
    environment:
      CORS_ORIGIN: http://localhost:18361
    ports: !override
      - "127.0.0.1:18363:8000"
    volumes:
      - ./.local/ticket36-backend/express.key:/run/secrets/express-jwt.key:ro
  frontend-vue:
    build:
      context: ./.local/ticket36-frontend
  nginx:
    ports: !override
      - "127.0.0.1:18361:80"
