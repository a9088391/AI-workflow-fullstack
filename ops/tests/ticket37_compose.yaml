# Ticket 37 僅在專用資料卷、測試金鑰與 loopback 埠驗證 Fastify。
services:
  db:
    environment:
      TICKET37_FIXTURE: isolated-ticket37
    command: ["postgres", "-c", "log_min_duration_statement=0", "-c", "log_line_prefix=%m [%p] %u@%d "]
  sql:
    volumes:
      - ./.local/ticket37-backend/backups:/backups
  laravel:
    ports: !override
      - "127.0.0.1:18372:8000"
    volumes:
      - ./.local/ticket37-backend/cors.php:/srv/laravel/config/cors.php:ro
      - ./.local/ticket37-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
      - ./.local/ticket37-backend/laravel-logs:/srv/laravel/storage/logs
  fastify:
    environment:
      CORS_ORIGIN: http://localhost:18371
    ports: !override
      - "127.0.0.1:18373:8000"
    volumes:
      - ./.local/ticket37-backend/fastify.key:/run/secrets/fastify-jwt.key:ro
  frontend-vue:
    build:
      context: ./.local/ticket37-frontend
  nginx:
    ports: !override
      - "127.0.0.1:18371:80"
