# Ticket 39 只啟動專用資料卷、測試金鑰與 loopback 埠的 Laravel/Fastify。
services:
  db:
    environment:
      TICKET39_FIXTURE: isolated-ticket39
    command: ["postgres", "-c", "log_min_duration_statement=0", "-c", "log_line_prefix=%m [%p] %u@%d "]
  sql:
    volumes:
      - ./.local/ticket39-backend/backups:/backups
  laravel:
    ports: !override
      - "127.0.0.1:18392:8000"
    volumes:
      - ./.local/ticket39-backend/cors.php:/srv/laravel/config/cors.php:ro
      - ./.local/ticket39-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
      - ./.local/ticket39-backend/laravel-logs:/srv/laravel/storage/logs
  fastify:
    environment:
      CORS_ORIGIN: http://localhost:18391
    ports: !override
      - "127.0.0.1:18393:8000"
    volumes:
      - ./.local/ticket39-backend/fastify.key:/run/secrets/fastify-jwt.key:ro
  frontend-vue:
    build:
      context: ./.local/ticket39-frontend
  nginx:
    ports: !override
      - "127.0.0.1:18391:80"
