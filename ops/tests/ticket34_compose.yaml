# Ticket 34 僅以專用資料卷、金鑰與 loopback 埠執行，不接觸展示資料。
services:
  db:
    environment:
      TICKET34_FIXTURE: isolated-ticket34
    command: ["postgres", "-c", "log_min_duration_statement=0", "-c", "log_line_prefix=%m [%p] %u@%d "]
  sql:
    volumes:
      - ./.local/ticket34-backend/backups:/backups
  laravel:
    ports: !override
      - "127.0.0.1:18342:8000"
    volumes:
      - ./.local/ticket34-backend/cors.php:/srv/laravel/config/cors.php:ro
      - ./.local/ticket34-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
      - ./.local/ticket34-backend/laravel-logs:/srv/laravel/storage/logs
  express:
    environment:
      CORS_ORIGIN: http://localhost:18341
    ports: !override
      - "127.0.0.1:18343:8000"
    volumes:
      - ./.local/ticket34-backend/express.key:/run/secrets/express-jwt.key:ro
  frontend-vue:
    build:
      context: ./.local/ticket34-frontend
  nginx:
    ports: !override
      - "127.0.0.1:18341:80"
