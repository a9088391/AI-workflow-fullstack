# Ticket 38 只啟動專用資料卷、測試金鑰與 loopback 埠的 Laravel/Fastify。
services:
  db:
    environment:
      TICKET38_FIXTURE: isolated-ticket38
    command: ["postgres", "-c", "log_min_duration_statement=0", "-c", "log_line_prefix=%m [%p] %u@%d "]
  sql:
    volumes:
      - ./.local/ticket38-backend/backups:/backups
  laravel:
    ports: !override
      - "127.0.0.1:18382:8000"
    volumes:
      - ./.local/ticket38-backend/cors.php:/srv/laravel/config/cors.php:ro
      - ./.local/ticket38-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
      - ./.local/ticket38-backend/laravel-logs:/srv/laravel/storage/logs
  fastify:
    environment:
      CORS_ORIGIN: http://localhost:18381
    ports: !override
      - "127.0.0.1:18383:8000"
    volumes:
      - ./.local/ticket38-backend/fastify.key:/run/secrets/fastify-jwt.key:ro
  frontend-vue:
    build:
      context: ./.local/ticket38-frontend
  nginx:
    ports: !override
      - "127.0.0.1:18381:80"
