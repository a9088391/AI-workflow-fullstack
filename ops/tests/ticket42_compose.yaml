# Ticket 42 僅在專用資料卷、測試金鑰與 loopback 埠驗證 NestJS。
services:
  db:
    environment:
      TICKET42_FIXTURE: isolated-ticket42
    command: ["postgres", "-c", "log_min_duration_statement=0", "-c", "log_line_prefix=%m [%p] %u@%d "]
  sql:
    volumes:
      - ./.local/ticket42-backend/backups:/backups
  laravel:
    ports: !override
      - "127.0.0.1:18422:8000"
    volumes:
      - ./.local/ticket42-backend/cors.php:/srv/laravel/config/cors.php:ro
      - ./.local/ticket42-backend/laravel.key:/run/secrets/laravel-jwt.key:ro
      - ./.local/ticket42-backend/laravel-logs:/srv/laravel/storage/logs
  nestjs:
    environment:
      CORS_ORIGIN: http://localhost:18421
    ports: !override
      - "127.0.0.1:18423:8000"
    volumes:
      - ./.local/ticket42-backend/nestjs.key:/run/secrets/nestjs-jwt.key:ro
  frontend-vue:
    build:
      context: ./.local/ticket42-frontend
  nginx:
    ports: !override
      - "127.0.0.1:18421:80"

# 本機既有測試網路已用盡 Docker 預設池；本票固定未占用子網以保持隔離。
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.248.0/24
